version: "3.9"
services:
  agentguard:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/agentguard.db}
      - AGENTGUARD_SECRET=${AGENTGUARD_SECRET:-dev-secret}
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY:-}
      - FEATHERLESS_MODEL=${FEATHERLESS_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - FEATHERLESS_BASE_URL=${FEATHERLESS_BASE_URL:-https://api.featherless.ai/v1}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CORS_ORIGINS=*
    volumes:
      - agentguard_data:/app/data
    restart: unless-stopped

  # Optional Postgres instead of the default SQLite file. To use it:
  #   1. uncomment this service and the `depends_on` line above
  #   2. set DATABASE_URL=postgresql://agentguard:agentguard@db:5432/agentguard
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: agentguard
  #     POSTGRES_PASSWORD: agentguard
  #     POSTGRES_DB: agentguard
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data

volumes:
  agentguard_data:
  # pg_data:
